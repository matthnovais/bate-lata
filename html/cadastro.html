<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro - Bate Lata</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header>
      <h1>Bate Lata</h1>
    </header>

    <nav class="navbar">
      <button
        class="menu-toggle"
        type="button"
        aria-label="Abrir menu de navegação"
        aria-expanded="false"
        aria-controls="menu-principal"
      >
        ☰
      </button>

      <ul id="menu-principal" class="menu">
        <li>
          <a href="index.html">Início</a>
        </li>

        <li class="dropdown">
          <a href="projetos.html">Projetos</a>

          <ul class="submenu">
            <li>
              <a href="projetos.html">Nossos projetos</a>
            </li>

            <li>
              <a href="cadastro.html">Voluntariado</a>
            </li>

            <li>
              <a href="cadastro.html">Doações</a>
            </li>
          </ul>
        </li>

        <li>
          <a href="cadastro.html">Cadastro</a>
        </li>
      </ul>
    </nav>

    <main class="grid">
      <h2 class="col-12">Cadastro de participação</h2>

      <form class="col-12">
        <fieldset>
          <legend>Dados pessoais</legend>

          <label for="nome">Nome:</label>
          <input type="text" id="nome" name="nome" required />

          <label for="email">E-mail:</label>
          <input type="email" id="email" name="email" required />

          <label for="telefone">Telefone:</label>
          <input
            type="tel"
            id="telefone"
            name="telefone"
            required
            maxlength="15"
            pattern="\([0-9]{2}\) [0-9]{4,5}-[0-9]{4}"
            placeholder="(00) 00000-0000"
          />

          <label for="nascimento">Data de Nascimento:</label>
          <input type="date" id="nascimento" name="nascimento" required />

          <label for="cpf">CPF:</label>
          <input
            type="text"
            id="cpf"
            name="cpf"
            required
            maxlength="14"
            pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
            placeholder="000.000.000-00"
          />
        </fieldset>

        <fieldset>
          <legend>Endereço</legend>

          <label for="cep">CEP:</label>
          <input
            type="text"
            id="cep"
            name="cep"
            required
            maxlength="9"
            pattern="[0-9]{5}-[0-9]{3}"
            placeholder="00000-000"
          />

          <label for="endereco">Endereço:</label>
          <input type="text" id="endereco" name="endereco" required />
        </fieldset>

        <fieldset>
          <legend>Participação</legend>

          <label for="participacao">Tipo de participação:</label>
          <select name="participacao" id="participacao" required>
            <option value="">Selecione</option>
            <option value="doador">Doador</option>
            <option value="parceiro">Parceiro</option>
            <option value="voluntario">Voluntário</option>
          </select>

          <label for="observacoes">Observações:</label>
          <br />
          <textarea name="observacoes" id="observacoes"></textarea>

          <button type="submit">Enviar</button>
        </fieldset>
      </form>
    </main>

    <footer>
      <p>© 2026 Bate Lata - Todos os direitos reservados.</p>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/formulario.js"></script>
  </body>
</html>
