<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ONG - Bate Lata</title>

  <link rel="stylesheet" href="../css/style.css" />
</head>

<body>
  <!-- Atalho de acessibilidade -->
  <a class="skip-link" href="#conteudo">
    Ir para o conteúdo principal
  </a>

  <!-- Cabeçalho -->
  <header>
    <a
      href="#inicio"
      data-pagina="inicio"
      class="logo"
      aria-label="Bate Lata - Página inicial"
    >
      <img
        src="../imagens/logo-bate-lata.png"
        alt=""
      />
    </a>
  </header>

  <!-- Navegação principal -->
  <nav class="navbar" aria-label="Navegação principal">

    <!-- Botão do menu mobile -->
    <button
      class="menu-toggle"
      type="button"
      aria-label="Abrir menu de navegação"
      aria-expanded="false"
      aria-controls="menu-principal"
    >
      ☰
    </button>

    <ul id="menu-principal" class="menu">

      <li>
        <a href="#inicio" data-pagina="inicio">
          Início
        </a>
      </li>

      <li class="dropdown">
        <a href="#projetos" data-pagina="projetos">
          Projetos
        </a>

        <ul class="submenu">
          <li>
            <a href="#projetos" data-pagina="projetos">
              Nossos projetos
            </a>
          </li>

          <li>
            <a href="#cadastro" data-pagina="cadastro">
              Voluntariado
            </a>
          </li>

          <li>
            <a href="#cadastro" data-pagina="cadastro">
              Doações
            </a>
          </li>
        </ul>
      </li>

      <li>
        <a href="#cadastro" data-pagina="cadastro">
          Cadastro
        </a>
      </li>

    </ul>
  </nav>

  <!-- Conteúdo renderizado pela SPA -->
  <main
    id="conteudo"
    class="grid"
    tabindex="-1"
  ></main>

  <!-- Rodapé -->
  <footer>
    <p>
      © 2026 Bate Lata - Todos os direitos reservados.
    </p>
  </footer>

  <!-- Botão flutuante de tema -->
  <button
    type="button"
    id="alternar-tema"
    class="tema-toggle"
    aria-label="Ativar modo escuro"
    aria-pressed="false"
    title="Ativar modo escuro"
  >
    🌙
  </button>

  <!-- JavaScript -->
  <script src="../js/templates.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/formulario.js"></script>
  <script src="../js/app.js"></script>
</body>

</html>
